
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Block Generator</title>

    <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">

    <!-- Load Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Shared Hero Styles: Used by Preview and Export -->
    <style id="hero-styles" type="text/tailwindcss">

        /* Main hero container */
        .hero {
            @apply flex items-center px-6 py-16;
        }

        /* Light appearance */
        .hero-light {
            @apply bg-slate-50;
        }

        .hero-light h1 {
            @apply text-slate-900;
        }

        .hero-light h2 {
            @apply text-slate-700;
        }

        /* Dark appearance */
        .hero-dark {
            @apply bg-slate-900;
        }

        .hero-dark h1 {
            @apply text-slate-50;
        }

        .hero-dark h2 {
            @apply text-slate-300;
        }

        /* Content container */
        .hero-content {
            @apply w-full;
        }

        /* Main heading */
        .hero h1 {
            @apply max-w-4xl text-4xl font-bold tracking-tight leading-tight;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        /* Subheading */
        .hero h2 {
            @apply mt-6 max-w-3xl text-xl leading-relaxed;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        /* Centre alignment */
        .hero-centre .hero-content {
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        .hero-centre h1,
        .hero-centre h2 {
            margin-left: auto;
            margin-right: auto;
        }

        /* Minimum height */
        .hero-min-height {
            @apply min-h-[480px];
        }

        /* Respect the hidden property */
        .hero h2[hidden] {
            display: none !important;
        }

        /* Tablet and desktop adjustments (768px and above) */
        @media (min-width: 768px) {

            .hero {
                @apply px-12 py-20;
            }

            .hero h1 {
                @apply text-6xl;
            }

            .hero h2 {
                @apply text-2xl;
            }

            .hero-min-height {
                @apply min-h-[85vh];
            }
        }

    </style>

    <!-- Editor Interface Styles -->
    <style id="editor-styles" type="text/tailwindcss">

        .app-shell {
            @apply min-h-screen bg-white text-slate-800;
        }

        .app-main {
            @apply mx-auto max-w-6xl px-5 pt-8 pb-32;
        }

        .app-title {
            @apply text-2xl font-bold tracking-tight;
        }

        .app-description {
            @apply mt-2 text-sm text-slate-500;
        }

        /* Control panel */
        .control-panel {
            @apply mt-6 rounded-xl border border-slate-200 bg-white p-4 shadow-sm;
        }

        .control-heading {
            @apply mb-3 text-sm font-semibold text-slate-700;
        }

        .control-list {
            @apply flex flex-wrap items-center gap-x-6 gap-y-4;
        }

        .control-option {
            @apply inline-flex cursor-pointer items-center gap-2 text-sm font-medium text-slate-700;
        }

        .control-option input {
            @apply size-4 cursor-pointer accent-slate-800;
        }

        .control-option input:focus-visible {
            outline: 3px solid #3b82f6;
            outline-offset: 4px;
            border-radius: 3px;
        }

        /* Preview section */
        .preview-section {
            @apply mt-7;
        }

        .preview-heading {
            @apply mb-3 text-sm font-semibold text-slate-700;
        }

        .preview-frame {
            @apply overflow-hidden rounded-xl border border-slate-200 shadow-sm;
        }

        .instruction {
            @apply mt-3 text-sm text-slate-500;
        }

        /* Editable heading focus */
        .editable-heading {
            outline: none;
            border-radius: 4px;
            cursor: text;
        }

        .editable-heading:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 6px;
        }

        /* Copy button */
        .copy-button {
            @apply fixed right-5 bottom-5 z-50 rounded-lg bg-slate-900 px-6 py-3 text-sm font-semibold text-white shadow-lg transition;
        }

        .copy-button:hover {
            @apply bg-slate-700;
        }

        .copy-button:focus-visible {
            outline: 3px solid #3b82f6;
            outline-offset: 4px;
        }

        /* Status message */
        .status-message {
            @apply mt-4 text-sm font-medium text-slate-600;
        }

        /* Manual copying fallback */
        .fallback-section {
            @apply mt-5;
        }

        .fallback-label {
            @apply mb-2 block text-sm font-semibold text-slate-700;
        }

        .fallback-textarea {
            @apply min-h-64 w-full rounded-lg border border-slate-300 bg-slate-50 p-3 font-mono text-xs leading-relaxed text-slate-800;
            resize: vertical;
        }

        .fallback-textarea:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 3px;
        }

    </style>
</head>

<body>

    <div class="app-shell">

        <main class="app-main">

            <!-- Application Introduction -->
            <header>
                <p class="app-title">Hero Block Generator</p>

                <p class="app-description">
                    Create and customise a simple website hero section.
                </p>
            </header>


            <!-- Controls -->
            <section class="control-panel" aria-labelledby="controls-title">

                <h2 id="controls-title" class="control-heading">
                    Hero Settings
                </h2>

                <div class="control-list">

                    <label class="control-option">
                        <input
                            type="checkbox"
                            id="darkAppearance"
                        >
                        Dark appearance
                    </label>

                    <label class="control-option">
                        <input
                            type="checkbox"
                            id="centreText"
                        >
                        Centre text
                    </label>

                    <label class="control-option">
                        <input
                            type="checkbox"
                            id="minimumHeight"
                            checked
                        >
                        Minimum height
                    </label>

                    <label class="control-option">
                        <input
                            type="checkbox"
                            id="showSubheading"
                            checked
                        >
                        Show subheading
                    </label>

                </div>

            </section>


            <!-- Hero Preview -->
            <section class="preview-section" aria-labelledby="preview-title">

                <h2 id="preview-title" class="preview-heading">
                    Live Preview
                </h2>

                <div class="preview-frame">

                    <header
                        id="heroPreview"
                        class="hero hero-light hero-min-height"
                    >

                        <div class="hero-content">

                            <h1
                                id="heroHeading"
                                class="editable-heading"
                                contenteditable="plaintext-only"
                                role="textbox"
                                aria-label="Edit main hero heading"
                                aria-multiline="true"
                                spellcheck="true"
                            >Lorem ipsum dolor sit amet</h1>

                            <h2
                                id="heroSubheading"
                                class="editable-heading"
                                contenteditable="plaintext-only"
                                role="textbox"
                                aria-label="Edit hero subheading"
                                aria-multiline="true"
                                spellcheck="true"
                            >Consectetur adipiscing elit. Integer vitae libero ac risus egestas placerat.</h2>

                        </div>

                    </header>

                </div>

                <p class="instruction">
                    Click a heading to edit the text.
                </p>

            </section>


            <!-- Copy Status -->
            <p
                id="copyStatus"
                class="status-message"
                role="status"
                aria-live="polite"
            ></p>


            <!-- Manual Copy Fallback -->
            <section
                id="fallbackSection"
                class="fallback-section"
                hidden
            >

                <label
                    for="exportedHTML"
                    class="fallback-label"
                >
                    Copy your HTML manually
                </label>

                <textarea
                    id="exportedHTML"
                    class="fallback-textarea"
                    readonly
                    aria-label="Generated standalone HTML code"
                ></textarea>

            </section>

        </main>

    </div>


    <!-- Fixed Copy Button -->
    <button
        type="button"
        id="copyButton"
        class="copy-button"
    >
        Copy HTML
    </button>


    <script>

        // ==========================================
        // 1. GET HTML ELEMENTS
        // ==========================================

        const darkAppearanceCheckbox =
            document.getElementById('darkAppearance');

        const centreTextCheckbox =
            document.getElementById('centreText');

        const minimumHeightCheckbox =
            document.getElementById('minimumHeight');

        const showSubheadingCheckbox =
            document.getElementById('showSubheading');

        const heroPreview =
            document.getElementById('heroPreview');

        const heroHeading =
            document.getElementById('heroHeading');

        const heroSubheading =
            document.getElementById('heroSubheading');

        const copyButton =
            document.getElementById('copyButton');

        const copyStatus =
            document.getElementById('copyStatus');

        const fallbackSection =
            document.getElementById('fallbackSection');

        const exportedHTML =
            document.getElementById('exportedHTML');

        const heroStyles =
            document.getElementById('hero-styles').textContent;


        // ==========================================
        // 2. SETTINGS OBJECT
        // ==========================================

        // Read the initial checkbox states.

        const settings = {
            darkAppearance: darkAppearanceCheckbox.checked,
            centreText: centreTextCheckbox.checked,
            minimumHeight: minimumHeightCheckbox.checked,
            showSubheading: showSubheadingCheckbox.checked
        };


        // ==========================================
        // 3. READ CHECKBOX SETTINGS
        // ==========================================

        function readSettings() {

            settings.darkAppearance =
                darkAppearanceCheckbox.checked;

            settings.centreText =
                centreTextCheckbox.checked;

            settings.minimumHeight =
                minimumHeightCheckbox.checked;

            settings.showSubheading =
                showSubheadingCheckbox.checked;

        }


        // ==========================================
        // 4. UPDATE HERO PREVIEW
        // ==========================================

        function updatePreview() {

            readSettings();

            // Change the appearance without replacing
            // the heading elements.

            heroPreview.classList.toggle(
                'hero-dark',
                settings.darkAppearance
            );

            heroPreview.classList.toggle(
                'hero-light',
                !settings.darkAppearance
            );

            heroPreview.classList.toggle(
                'hero-centre',
                settings.centreText
            );

            heroPreview.classList.toggle(
                'hero-min-height',
                settings.minimumHeight
            );

            // Hide the subheading when unchecked.
            // Its text remains in the original element.

            heroSubheading.hidden =
                !settings.showSubheading;

            // Refresh the generated HTML.

            updateExportTextarea();

        }


        // ==========================================
        // 5. ESCAPE HTML TEXT
        // ==========================================

        function escapeHTML(text) {

            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

        }


        // ==========================================
        // 6. BUILD STANDALONE HTML DOCUMENT
        // ==========================================

        function buildExportHTML() {

            readSettings();

            // Get the latest edited heading text.

            const headingText =
                escapeHTML(heroHeading.textContent);

            const subheadingText =
                escapeHTML(heroSubheading.textContent);

            // Build the hero classes using current settings.

            const heroClasses = [
                'hero',
                settings.darkAppearance
                    ? 'hero-dark'
                    : 'hero-light',
                settings.centreText
                    ? 'hero-centre'
                    : '',
                settings.minimumHeight
                    ? 'hero-min-height'
                    : ''
            ].filter(Boolean).join(' ');


            // Include the H2 only when requested.

            let subheadingHTML = '';

            if (settings.showSubheading) {

                subheadingHTML =
                    `<h2>${subheadingText}</h2>`;

            }


            // Return a complete standalone HTML document.

            const completeHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hero Block</title>

    <meta name="description" content="Short, unique description of web page. Often used as the snippet shown in search results. About 120 characters is ideal.">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"><\/script>

    <style type="text/tailwindcss">
${heroStyles}
    </style>
</head>

<body>

    <header class="${heroClasses}">
        <div class="hero-content">

            <h1>${headingText}</h1>

            ${subheadingHTML}

        </div>
    </header>

</body>
</html>`;

            return completeHTML;

        }


        // ==========================================
        // 7. UPDATE MANUAL COPY TEXTAREA
        // ==========================================

        function updateExportTextarea() {

            exportedHTML.value = buildExportHTML();

        }


        // ==========================================
        // 8. INSERT PLAIN TEXT AT CURSOR
        // ==========================================

        function insertPlainTextAtCursor(element, text) {

            const selection = window.getSelection();

            if (!selection || selection.rangeCount === 0) {

                element.appendChild(
                    document.createTextNode(text)
                );

                return;

            }

            const range = selection.getRangeAt(0);

            // Make sure the cursor is inside the heading.

            if (!element.contains(range.commonAncestorContainer)) {

                element.appendChild(
                    document.createTextNode(text)
                );

                return;

            }

            // Insert a text node instead of HTML.

            range.deleteContents();

            const textNode =
                document.createTextNode(text);

            range.insertNode(textNode);

            // Move the cursor after the inserted text.

            range.setStartAfter(textNode);
            range.collapse(true);

            selection.removeAllRanges();
            selection.addRange(range);

        }


        // ==========================================
        // 9. HANDLE PASTING PLAIN TEXT
        // ==========================================

        function handlePlainTextPaste(event) {

            event.preventDefault();

            const pastedText =
                event.clipboardData.getData('text/plain');

            insertPlainTextAtCursor(
                event.currentTarget,
                pastedText
            );

        }


        // ==========================================
        // 10. KEEP EDITED HEADINGS AS PLAIN TEXT
        // ==========================================

        function handleHeadingKeydown(event) {

            // Prevent Enter from creating additional
            // HTML elements inside the heading.

            if (event.key === 'Enter') {

                event.preventDefault();

                insertPlainTextAtCursor(
                    event.currentTarget,
                    '\n'
                );

            }

        }


        // ==========================================
        // 11. COPY HTML
        // ==========================================

        async function copyHTML() {

            // Always generate fresh HTML before copying.

            const htmlToCopy = buildExportHTML();

            exportedHTML.value = htmlToCopy;

            try {

                // Check whether the Clipboard API exists.

                if (
                    !navigator.clipboard ||
                    !navigator.clipboard.writeText
                ) {

                    throw new Error(
                        'Clipboard API is unavailable.'
                    );

                }

                // Copy the generated HTML.

                await navigator.clipboard.writeText(
                    htmlToCopy
                );

                // Only display success after copying works.

                copyStatus.textContent =
                    'HTML copied—paste it into VS Code.';

                fallbackSection.hidden = true;

            }

            catch (error) {

                // Display the HTML for manual copying.

                copyStatus.textContent =
                    'Automatic copying is unavailable. Copy the HTML from the box below.';

                fallbackSection.hidden = false;

                exportedHTML.focus();
                exportedHTML.select();

            }

        }


        // ==========================================
        // 12. CONNECT CHECKBOX EVENTS
        // ==========================================

        darkAppearanceCheckbox.addEventListener(
            'change',
            updatePreview
        );

        centreTextCheckbox.addEventListener(
            'change',
            updatePreview
        );

        minimumHeightCheckbox.addEventListener(
            'change',
            updatePreview
        );

        showSubheadingCheckbox.addEventListener(
            'change',
            updatePreview
        );


        // ==========================================
        // 13. CONNECT HEADING EDITING EVENTS
        // ==========================================

        const editableHeadings = [
            heroHeading,
            heroSubheading
        ];

        editableHeadings.forEach(function(heading) {

            heading.addEventListener(
                'input',
                updateExportTextarea
            );

            heading.addEventListener(
                'paste',
                handlePlainTextPaste
            );

            heading.addEventListener(
                'keydown',
                handleHeadingKeydown
            );

        });


        // ==========================================
        // 14. CONNECT COPY BUTTON
        // ==========================================

        copyButton.addEventListener(
            'click',
            copyHTML
        );


        // ==========================================
        // 15. INITIALISE APPLICATION
        // ==========================================

        updatePreview();

    </script>

</body>
</html>
